[project]
name = "costing-backend"
version = "1.0.0"
description = "Costing master data API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "openpyxl==3.1.5",
    "python-multipart==0.0.20",
    "python-dotenv==1.2.4",
]

[tool.uv]
# An application, not a library: install dependencies only, don't build the project itself.
package = false
