# docker compose up -d --build
#   costing: app under BASE_PATH (default /costing) on 127.0.0.1:8000 -> http://127.0.0.1:8000/costing/
#            image build: frontend/ is built with "npm ci && npm run build" (FRONTEND_SOURCE=build),
#            or taken from the host-built backend/static (FRONTEND_SOURCE=prebuilt);
#            then the Python deps are installed and the frontend is copied to /app/backend/static
#   nginx:   host port 80 -> COSTING_DOMAIN (this app; / redirects to BASE_PATH/)
#            and VOICE_DOMAIN -> voice_call project's nginx on host port 8082
#            Local defaults: http://localhost/costing/ and http://scm.localhost/voicecall/
#            Server: COSTING_DOMAIN=ai.bullmachine.in, VOICE_DOMAIN=scm.ai.bullmachine.in in .env
services:
  costing:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # build (server) | prebuilt (run "npm run build" in frontend/ first; for networks that block npm)
        FRONTEND_SOURCE: ${FRONTEND_SOURCE:-build}
    image: costing:latest
    # FastAPI on 0.0.0.0:8000 (APP_HOST/APP_PORT set in the Dockerfile); serves /api and the frontend
    command: ["uv", "run", "--no-sync", "backend/run.py"]
    working_dir: /app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - costing-data:/data
    environment:
      BASE_PATH: ${BASE_PATH:-/costing}
      MAX_UPLOAD_MB: "100"
      # Substituted from the .env file next to this compose file; startup fails if unset
      APP_USER: ${APP_USER:?set APP_USER in .env}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - costing
    ports:
      - "80:80"
    environment:
      COSTING_DOMAIN: ${COSTING_DOMAIN:-localhost}
      VOICE_DOMAIN: ${VOICE_DOMAIN:-scm.localhost}
      BASE_PATH: ${BASE_PATH:-/costing}
    extra_hosts:
      # Lets nginx reach the voice_call nginx published on the host
      - "host.docker.internal:host-gateway"
    volumes:
      # Rendered to /etc/nginx/conf.d/default.conf with the values above
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro

volumes:
  costing-data:
