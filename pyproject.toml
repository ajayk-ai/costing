[project]
name = "costing"
version = "0.1.0"
description = "Costing master data web app (FastAPI backend, React frontend)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "openpyxl==3.1.5",
    "python-multipart==0.0.20",
    "python-dotenv==1.2.4",
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "joblib>=1.4",
]

[tool.uv]
# An application, not a library: install dependencies only, don't build the project itself.
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "backend/tests"]
